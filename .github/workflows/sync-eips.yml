# =============================================================================
# Sync EIPs from Upstream
# =============================================================================
# Periodically checks the upstream ethereum/EIPs repository for new or updated
# EIP files, syncs them to this fork's personal-site branch, and repatches the
# ERC metadata from the ethereum/ercs repository.
#
# Schedule: Daily at 06:00 UTC
# Trigger:  Manual (workflow_dispatch) and scheduled
# =============================================================================
# NOTE: The `push` trigger is intentionally omitted to prevent an infinite
# loop. When the workflow pushes changes to personal-site, GitHub would
# re-trigger the workflow. Use the manual trigger or wait for the daily
# schedule instead.
# =============================================================================

name: Sync EIPs from upstream

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_commit:
        description: 'Skip commit and push (dry-run mode)'
        required: false
        default: false
        type: boolean

# Limit to one concurrent sync — cancel any running one
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync EIP files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---------------------------------------------------------------
      # Step 1: Checkout the personal-site branch with full history
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: personal-site
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # Step 2: Set up Python for the ERC metadata script
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------
      # Step 3: Run the sync script
      # ---------------------------------------------------------------
      - name: Sync EIP files from upstream
        id: sync
        run: |
          bash scripts/sync-eips.sh 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------------
      # Step 4: Commit and push changes (unless dry-run)
      # ---------------------------------------------------------------
      - name: Commit and push changes
        if: steps.sync.outputs.exit_code == '0' && !inputs.skip_commit
        run: |
          # Check if there are any changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "✓ No changes to commit."
            exit 0
          fi

          git config user.name "EIP Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          CHANGED_COUNT=$(git diff --cached --name-only -- EIPS/ | wc -l)
          git commit -m "Sync EIPs from upstream ethereum/EIPs ($(date +'%Y-%m-%d'))" \
            -m "Automated sync from upstream. ${CHANGED_COUNT} file(s) updated." \
            -m "Includes ERC metadata patches from ethereum/ercs."

          git push origin personal-site
          echo "✓ Changes committed and pushed to personal-site"

      - name: Dry-run or no changes
        if: always()
        run: |
          echo "Exit code: ${{ steps.sync.outputs.exit_code }}"
          if [ "${{ steps.sync.outputs.exit_code }}" != "0" ]; then
            echo "⚠ Sync script exited with error. Check the logs above."
          elif [ -n "$(git status --porcelain)" ] && [ "${{ inputs.skip_commit }}" == "true" ]; then
            echo "⚠ Dry-run mode — changes detected but not committed:"
            git status --short
          elif [ -z "$(git status --porcelain)" ]; then
            echo "✓ All EIP files are up to date with upstream."
          fi